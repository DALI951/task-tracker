<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Account Creator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 24px; }
        .header .icon { width: 56px; height: 56px; background: #E53935; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .header .icon svg { width: 28px; height: 28px; fill: white; }
        .header h1 { font-size: 20px; color: #1a1a1a; }
        .header p { font-size: 13px; color: #666; margin-top: 4px; }
        .gate { text-align: center; }
        .gate input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #E53935; box-shadow: 0 0 0 3px rgba(229,57,53,0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: #E53935; color: white; }
        .btn-primary:hover { background: #C62828; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; margin-top: 8px; }
        .btn-secondary:hover { background: #e0e0e0; }
        .message { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
        .message.error { background: #ffebee; color: #c62828; }
        .hidden { display: none; }
        .role-options { display: flex; gap: 12px; }
        .role-options label { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
        .role-options input[type="radio"] { display: none; }
        .role-options input[type="radio"]:checked + span { color: #E53935; }
        .role-options label:has(input:checked) { border-color: #E53935; background: #fff5f5; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Admin Gate -->
        <div id="gateScreen" class="gate">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <h1>Task Tracker</h1>
                <p>Admin Access Required</p>
            </div>
            <input type="password" id="adminPass" placeholder="Admin passphrase" onkeypress="if(event.key==='Enter')authGate()">
            <button class="btn btn-primary" onclick="authGate()">Continue</button>
        </div>

        <!-- Account Creation Form -->
        <div id="formScreen" class="hidden">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <h1>Create Account</h1>
                <p>Register a new user for the app</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="displayName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Role</label>
                <div class="role-options">
                    <label>
                        <input type="radio" name="role" value="manager" checked>
                        <span>Manager</span>
                    </label>
                    <label>
                        <input type="radio" name="role" value="employee">
                        <span>Employee</span>
                    </label>
                </div>
            </div>
            <button class="btn btn-primary" id="createBtn" onclick="createAccount()">Create Account</button>
            <button class="btn btn-secondary" onclick="signOutAdmin()">Sign Out</button>
            <div id="message"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCq3-FOmjHuQH86QfA5Vf7c8hyneS0nbC0",
            authDomain: "task-tracker-6d7e1.firebaseapp.com",
            projectId: "task-tracker-6d7e1",
            storageBucket: "task-tracker-6d7e1.firebasestorage.app",
            messagingSenderId: "202182349540",
            appId: "1:202182349540:web:ac882cbe77afa54f5752f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_PASS = 'tasktracker2024';

        window.authGate = function() {
            const pass = document.getElementById('adminPass').value;
            if (pass !== ADMIN_PASS) {
                showMessage('Invalid passphrase', 'error');
                return;
            }
            document.getElementById('gateScreen').classList.add('hidden');
            document.getElementById('formScreen').classList.remove('hidden');
        };

        window.createAccount = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value.trim();
            const role = document.querySelector('input[name="role"]:checked').value;

            if (!email || !password || !displayName) {
                showMessage('All fields are required', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            const btn = document.getElementById('createBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const response = await fetch(
                    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            returnSecureToken: true
                        })
                    }
                );

                const data = await response.json();

                if (data.error) {
                    showMessage(data.error.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                    return;
                }

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                const batch = [
                    setDoc(doc(db, 'users', uid), {
                        email: email,
                        displayName: displayName,
                        role: role,
                        createdAt: new Date().toISOString()
                    })
                ];

                if (role === 'employee') {
                    batch.push(setDoc(doc(db, 'employees', email), {
                        email: email,
                        name: displayName,
                        displayName: displayName,
                        createdBy: 'web_admin',
                        createdAt: new Date().toISOString()
                    }));
                }

                await Promise.all(batch);
                await signOut(auth);

                showMessage(`Account created: ${email} (${role})`, 'success');

                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('displayName').value = '';

                btn.disabled = false;
                btn.textContent = 'Create Account';
            } catch (e) {
                showMessage(e.message || 'Failed to create account', 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        };

        window.signOutAdmin = function() {
            signOut(auth);
            document.getElementById('formScreen').classList.add('hidden');
            document.getElementById('gateScreen').classList.remove('hidden');
            document.getElementById('adminPass').value = '';
        };

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.className = `message ${type}`;
            el.textContent = text;
            setTimeout(() => { el.textContent = ''; el.className = ''; }, 5000);
        }
    </script>
</body>
</html>
