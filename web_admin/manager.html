<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 24px; }
        .header .icon { width: 56px; height: 56px; background: #E53935; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .header .icon svg { width: 28px; height: 28px; fill: white; }
        .header h1 { font-size: 20px; color: #1a1a1a; }
        .header p { font-size: 13px; color: #666; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #E53935; box-shadow: 0 0 0 3px rgba(229,57,53,0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-decoration: none; display: block; text-align: center; }
        .btn-primary { background: #E53935; color: white; }
        .btn-primary:hover { background: #C62828; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; margin-top: 8px; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-big { padding: 18px; font-size: 16px; margin-bottom: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
        .message.error { background: #ffebee; color: #c62828; }
        .hidden { display: none; }
        .account-email { text-align: center; font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; }
        .note { font-size: 12px; color: #888; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Home -->
        <div id="homeScreen" class="screen">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                </div>
                <h1>Task Tracker</h1>
                <p>Manager account</p>
            </div>
            <button class="btn btn-primary btn-big" onclick="showScreen('signinScreen')">Sign In</button>
            <a class="btn btn-secondary btn-big" href="http://modali.powerpme.com/tasktracker/" target="_blank" rel="noopener">Create Account (secure page)</a>
            <button class="btn btn-secondary btn-big" onclick="showScreen('changeScreen')">Change Password</button>
        </div>

        <!-- Sign in -->
        <div id="signinScreen" class="screen hidden">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                </div>
                <h1>Sign In</h1>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="siEmail" placeholder="user@example.com" onkeypress="if(event.key==='Enter')signIn()">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="siPass" placeholder="Password" onkeypress="if(event.key==='Enter')signIn()">
            </div>
            <button class="btn btn-primary" id="siBtn" onclick="signIn()">Sign In</button>
            <button class="btn btn-secondary" onclick="showScreen('homeScreen')">Back</button>
            <div id="signinMsg"></div>
        </div>

        <!-- Account (signed in) -->
        <div id="accountScreen" class="screen hidden">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <h1>Signed In</h1>
            </div>
            <div class="account-email" id="accountEmail"></div>
            <button class="btn btn-primary btn-big" id="cpSignedBtn" onclick="resetForSignedIn()">Change Password</button>
            <a class="btn btn-secondary btn-big" href="https://dali951.github.io/task-tracker/" target="_blank" rel="noopener">Open the app</a>
            <button class="btn btn-secondary btn-big" onclick="signOut()">Sign Out</button>
            <div id="accountMsg"></div>
        </div>

        <!-- Change password -->
        <div id="changeScreen" class="screen hidden">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-9.9-2c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.1V6z"/></svg>
                </div>
                <h1>Change Password</h1>
                <p>We'll email you a link to set a new password</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="cpEmail" placeholder="user@example.com" onkeypress="if(event.key==='Enter')sendReset()">
            </div>
            <button class="btn btn-primary" id="cpBtn" onclick="sendReset()">Send Reset Email</button>
            <button class="btn btn-secondary" onclick="showScreen('homeScreen')">Back</button>
            <div id="cpMsg"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut as fbSignOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCq3-FOmjHuQH86QfA5Vf7c8hyneS0nbC0",
            authDomain: "task-tracker-6d7e1.firebaseapp.com",
            projectId: "task-tracker-6d7e1",
            storageBucket: "task-tracker-6d7e1.firebasestorage.app",
            messagingSenderId: "202182349540",
            appId: "1:202182349540:web:ac882cbe77afa54f5752f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showMessage(text, type, id) {
            const el = document.getElementById(id);
            el.className = 'message ' + type;
            el.textContent = text;
            setTimeout(() => { el.textContent = ''; el.className = ''; }, 8000);
        }

        function friendlyError(e) {
            const map = {
                'auth/invalid-credential': 'Wrong email or password.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Wrong password.',
                'auth/invalid-email': 'That email address looks invalid.',
                'auth/email-already-in-use': 'An account with this email already exists.',
                'auth/weak-password': 'Password must be at least 6 characters.',
                'auth/unauthorized-domain': 'This domain is not authorized for sign-in. Add it in Firebase Auth settings.',
                'auth/network-request-failed': 'Network error. Check your connection and try again.',
                'auth/too-many-requests': 'Too many attempts. Wait a moment and try again.',
            };
            return map[e.code] || (e.code ? e.code + ': ' + e.message : 'Something went wrong. Please try again.');
        }

        window.signIn = async function () {
            const email = document.getElementById('siEmail').value.trim();
            const password = document.getElementById('siPass').value;
            if (!email || !password) {
                showMessage('Enter your email and password.', 'error', 'signinMsg');
                return;
            }
            const btn = document.getElementById('siBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('accountEmail').textContent = cred.user.email || '';
                document.getElementById('cpEmail').value = cred.user.email || '';
                document.getElementById('siPass').value = '';
                showScreen('accountScreen');
            } catch (e) {
                showMessage(friendlyError(e), 'error', 'signinMsg');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        };

        window.signOut = async function () {
            try {
                await fbSignOut(auth);
            } catch (e) {
                // Sign-out rarely fails; still return home.
            }
            showScreen('homeScreen');
        };

        window.resetForSignedIn = async function () {
            const email = auth.currentUser ? auth.currentUser.email : '';
            if (!email) {
                showMessage('You are not signed in.', 'error', 'accountMsg');
                return;
            }
            const btn = document.getElementById('cpSignedBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('Reset email sent to ' + email + '. Check your inbox.', 'success', 'accountMsg');
            } catch (e) {
                showMessage(friendlyError(e), 'error', 'accountMsg');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Change Password';
            }
        };

        window.sendReset = async function () {
            const email = document.getElementById('cpEmail').value.trim();
            if (!email) {
                showMessage('Enter your email address.', 'error', 'cpMsg');
                return;
            }
            const btn = document.getElementById('cpBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('Reset email sent. Check your inbox and click the link to set a new password.', 'success', 'cpMsg');
            } catch (e) {
                showMessage(friendlyError(e), 'error', 'cpMsg');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Email';
            }
        };
    </script>
</body>
</html>
