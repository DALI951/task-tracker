<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Moderator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 24px; }
        .header .icon { width: 56px; height: 56px; background: #1565C0; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .header .icon svg { width: 28px; height: 28px; fill: white; }
        .header h1 { font-size: 20px; color: #1a1a1a; }
        .header p { font-size: 13px; color: #666; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #1565C0; box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: #1565C0; color: white; }
        .btn-primary:hover { background: #0D47A1; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; margin-top: 8px; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-danger { background: #ffebee; color: #c62828; margin-top: 8px; }
        .btn-danger:hover { background: #ffcdd2; }
        .link { text-align: center; margin-top: 16px; }
        .link a { color: #1565C0; font-size: 13px; cursor: pointer; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .message { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
        .message.error { background: #ffebee; color: #c62828; }
        .hidden { display: none; }
        .dashboard-info { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .dashboard-info .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
        .dashboard-info .value { font-size: 15px; color: #1a1a1a; font-weight: 500; margin-top: 2px; }
        .section-title { font-size: 13px; font-weight: 700; color: #666; margin: 20px 0 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .divider { height: 1px; background: #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Sign Up Screen -->
        <div id="signupScreen">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <h1>Create Account</h1>
                <p>Register as a moderator</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="suEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="suPassword" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="suName" placeholder="Your name">
            </div>
            <button class="btn btn-primary" id="suBtn" onclick="signUp()">Create Account</button>
            <div class="link"><a onclick="showScreen('loginScreen')">Already have an account? Log In</a></div>
            <div id="suMessage"></div>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="hidden">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your account</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="liEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="liPassword" placeholder="Your password" onkeypress="if(event.key==='Enter')logIn()">
            </div>
            <button class="btn btn-primary" id="liBtn" onclick="logIn()">Log In</button>
            <div class="link"><a onclick="showScreen('signupScreen')">Don't have an account? Sign Up</a></div>
            <div id="liMessage"></div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="hidden">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <h1>Moderator Panel</h1>
                <p id="dashEmail"></p>
            </div>

            <div class="dashboard-info">
                <div class="label">Display Name</div>
                <div class="value" id="dashName"></div>
            </div>
            <div class="dashboard-info">
                <div class="label">Email</div>
                <div class="value" id="dashEmailValue"></div>
            </div>
            <div class="dashboard-info">
                <div class="label">Role</div>
                <div class="value" id="dashRole"></div>
            </div>

            <div class="divider"></div>
            <div class="section-title">Change Password</div>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="cpCurrent" placeholder="Current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="cpNew" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="cpConfirm" placeholder="Confirm new password">
            </div>
            <button class="btn btn-primary" id="cpBtn" onclick="changePassword()">Update Password</button>
            <div id="cpMessage"></div>

            <div class="divider"></div>
            <button class="btn btn-danger" onclick="signOutUser()">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, reauthenticateWithCredential, EmailAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCq3-FOmjHuQH86QfA5Vf7c8hyneS0nbC0",
            authDomain: "task-tracker-6d7e1.firebaseapp.com",
            projectId: "task-tracker-6d7e1",
            storageBucket: "task-tracker-6d7e1.firebasestorage.app",
            messagingSenderId: "202182349540",
            appId: "1:202182349540:web:ac882cbe77afa54f5752f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showScreen(id) {
            document.getElementById('signupScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function showMsg(elId, text, type) {
            const el = document.getElementById(elId);
            el.className = 'message ' + type;
            el.textContent = text;
            if (type === 'success') setTimeout(() => { el.textContent = ''; el.className = ''; }, 3000);
        }

        window.showScreen = showScreen;

        window.signUp = async function() {
            const email = document.getElementById('suEmail').value.trim();
            const password = document.getElementById('suPassword').value;
            const displayName = document.getElementById('suName').value.trim();

            if (!email || !password || !displayName) {
                showMsg('suMessage', 'All fields are required', 'error');
                return;
            }
            if (password.length < 6) {
                showMsg('suMessage', 'Password must be at least 6 characters', 'error');
                return;
            }

            const btn = document.getElementById('suBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, 'users', cred.user.uid), {
                    email: email,
                    displayName: displayName,
                    role: 'manager',
                    createdAt: new Date().toISOString()
                });
                document.getElementById('dashEmail').textContent = email;
                document.getElementById('dashEmailValue').textContent = email;
                document.getElementById('dashName').textContent = displayName;
                document.getElementById('dashRole').textContent = 'Manager';
                showScreen('dashboardScreen');
            } catch (e) {
                showMsg('suMessage', e.message || 'Failed to create account', 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        };

        window.logIn = async function() {
            const email = document.getElementById('liEmail').value.trim();
            const password = document.getElementById('liPassword').value;

            if (!email || !password) {
                showMsg('liMessage', 'Email and password are required', 'error');
                return;
            }

            const btn = document.getElementById('liBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const userDoc = await getDoc(doc(db, 'users', cred.user.uid));

                if (userDoc.exists() && userDoc.data().role === 'manager') {
                    document.getElementById('dashEmail').textContent = cred.user.email;
                    document.getElementById('dashEmailValue').textContent = cred.user.email;
                    document.getElementById('dashName').textContent = userDoc.data().displayName || cred.user.email;
                    document.getElementById('dashRole').textContent = 'Manager';
                    showScreen('dashboardScreen');
                } else {
                    const role = userDoc.exists() ? userDoc.data().role : 'none';
                    showMsg('liMessage', 'Access Denied. Your role is: ' + role + '. Manager access required.', 'error');
                    await signOut(auth);
                }
            } catch (e) {
                showMsg('liMessage', e.message || 'Failed to sign in', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Log In';
        };

        window.changePassword = async function() {
            const current = document.getElementById('cpCurrent').value;
            const newPass = document.getElementById('cpNew').value;
            const confirm = document.getElementById('cpConfirm').value;

            if (!current || !newPass || !confirm) {
                showMsg('cpMessage', 'All fields are required', 'error');
                return;
            }
            if (newPass.length < 6) {
                showMsg('cpMessage', 'New password must be at least 6 characters', 'error');
                return;
            }
            if (newPass !== confirm) {
                showMsg('cpMessage', 'New passwords do not match', 'error');
                return;
            }

            const btn = document.getElementById('cpBtn');
            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const user = auth.currentUser;
                const credential = EmailAuthProvider.credential(user.email, current);
                await reauthenticateWithCredential(user, credential);
                await updatePassword(user, newPass);
                showMsg('cpMessage', 'Password updated successfully', 'success');
                document.getElementById('cpCurrent').value = '';
                document.getElementById('cpNew').value = '';
                document.getElementById('cpConfirm').value = '';
            } catch (e) {
                showMsg('cpMessage', e.message || 'Failed to update password', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Update Password';
        };

        window.signOutUser = async function() {
            await signOut(auth);
            showScreen('signupScreen');
            document.getElementById('suEmail').value = '';
            document.getElementById('suPassword').value = '';
            document.getElementById('suName').value = '';
        };
    </script>
</body>
</html>
