name: Build and Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'web_admin/**'
      - 'admin_app/**'
      - '*.md'
      - 'AGENTS.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode service account
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > assets/service-account.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk \
            "releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode service account
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > assets/service-account.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /task-tracker/

      - name: Zip web build
        run: |
          cd build/web
          zip -r ../../releases/Task-Tracker-v${{ steps.version.outputs.version }}-web.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: releases/Task-Tracker-v${{ steps.version.outputs.version }}-web.zip

      - name: Upload web pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: [build-apk, build-web]
    if: always() && (needs.build-apk.result == 'success' || needs.build-web.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release_files/ \; 2>/dev/null || true
          ls -la release_files/ || echo "No release files found"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Task Tracker v${{ steps.version.outputs.version }}"
          body: |
            ## Task Tracker v${{ steps.version.outputs.version }}

            ### Android
            1. Download `Task-Tracker-v${{ steps.version.outputs.version }}.apk`
            2. Open on your Android device
            3. Allow installation from unknown sources if prompted
            4. Tap Install

            ### Web Version
            1. Download `Task-Tracker-v${{ steps.version.outputs.version }}-web.zip`
            2. Extract and open `index.html` in your browser
            3. Or visit the live version: https://dali951.github.io/task-tracker/

            ### Changes
            See the commit history for detailed changes.
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
