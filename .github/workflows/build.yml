name: Build & Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'web_admin/**'
      - '*.md'
      - 'AGENTS.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk \
            "releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Zip web build
        run: |
          cd build/web
          zip -r ../../releases/Task-Tracker-v${{ steps.version.outputs.version }}-web.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: releases/Task-Tracker-v${{ steps.version.outputs.version }}-web.zip

      - name: Upload web pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup CMake 3.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Extract version
        id: version
        run: |
          $content = Get-Content pubspec.yaml | Select-String 'version:'
          $version = ($content -split ' ')[1] -split '\+' | Select-Object -First 1
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion="$version" "windows\installer\task-tracker-setup.iss"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: releases/Task-Tracker-v${{ steps.version.outputs.version }}-Setup.exe

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: [build-apk, build-web, build-windows]
    if: always() && (needs.build-apk.result == 'success' || needs.build-web.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: artifacts

      - name: Download Web ZIP
        uses: actions/download-artifact@v4
        with:
          name: web-zip
          path: artifacts

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
        continue-on-error: true

      - name: List artifacts
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Prepare release files
        id: files
        run: |
          FILES=$(ls release_files/ | sed 's|^|release_files/|' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Release files: $FILES"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Task Tracker v${{ steps.version.outputs.version }}"
          body: |
            ## Task Tracker v${{ steps.version.outputs.version }}

            ### Android
            1. Download `Task-Tracker-v${{ steps.version.outputs.version }}.apk`
            2. Open on your Android device
            3. Allow installation from unknown sources if prompted
            4. Tap Install

            ### Windows Desktop
            1. Download `Task-Tracker-v${{ steps.version.outputs.version }}-Setup.exe`
            2. Run the installer
            3. A desktop shortcut will be created automatically
            4. Launch from desktop or Start Menu

            ### Web Version
            1. Download `Task-Tracker-v${{ steps.version.outputs.version }}-web.zip`
            2. Extract and open `index.html` in your browser
            3. Or visit the live version: https://dali951.github.io/task-tracker/

            ### Changes
            See the commit history for detailed changes.
          files: |
            release_files/*.apk
            release_files/*.zip
            release_files/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
