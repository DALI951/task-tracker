name: Build & Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'web_admin/**'
      - '*.md'
      - 'AGENTS.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Task Tracker v${{ steps.version.outputs.version }}"
          body: |
            ## Task Tracker v${{ steps.version.outputs.version }}

            ### Installation
            1. Download the APK below
            2. Open the APK file on your Android device
            3. If prompted, allow installation from unknown sources
            4. Tap Install

            ### Changes
            See the commit history for detailed changes.
          files: releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
