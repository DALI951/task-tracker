name: Build and Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'admin_app/**'
      - '*.md'
      - 'AGENTS.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk \
            "releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: releases/Task-Tracker-v${{ steps.version.outputs.version }}.apk

  create-release:
    needs: [build-apk]
    if: always() && needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.exe' -o -name '*.ipa' \) -exec cp {} release_files/ \; 2>/dev/null || true
          ls -la release_files/ || echo "No release files found"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "## Task Tracker v${{ steps.version.outputs.version }}"
            echo ""
            echo "### Install"
            echo "- Android: download and open the .apk (allow unknown sources)"
            echo ""
            echo "### What's New"
            echo ""
          } > body.md
          PREV=$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)
          if [ -n "$PREV" ]; then
            git log --oneline --reverse "$PREV..HEAD" >> body.md
          else
            git log --oneline --reverse -20 HEAD >> body.md
          fi
          echo "body_path=body.md" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Task Tracker v${{ steps.version.outputs.version }}"
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

