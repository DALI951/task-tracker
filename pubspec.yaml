name: task_tracker
description: Enterprise task tracker with photo proof of completion.
publish_to: 'none'
version: 0.4.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  package_info_plus: ^8.1.3
  dio: ^5.7.0
  permission_handler: ^11.3.1
  open_file: ^3.5.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
